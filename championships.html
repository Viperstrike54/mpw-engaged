
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPW ENGAGED | Championships</title>
<style>
:root{--bg:#100b19;--panel:#1e162c;--panel2:#291e3a;--gold:#dfbb69;--text:#f5f0fa;--muted:#aaa0b8;--line:#463754}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}
header{background:#170f23;border-bottom:1px solid var(--line);padding:17px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:1px;color:var(--gold);font-size:19px}
a{color:var(--gold);text-decoration:none}
main{max-width:1050px;margin:auto;padding:18px 13px 60px}
h1{font-size:25px;margin:8px 0 5px}
h2{font-size:19px;margin:0 0 14px}
p{color:var(--muted);line-height:1.5}
button,input,select,textarea{font:inherit}
button{background:#342442;border:1px solid #655076;color:white;padding:10px 13px;border-radius:10px;cursor:pointer}
button.primary{background:var(--gold);color:#211524;border-color:var(--gold);font-weight:800}
button.danger{border-color:#9a525e;color:#ffb4bd}
button:disabled{opacity:.5}
input,select,textarea{width:100%;background:#130e1d;border:1px solid #675578;color:white;padding:11px;border-radius:9px}
textarea{min-height:90px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:14px 0}
.flex{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.small{font-size:12px;color:var(--muted)}
.gold{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.stat{background:var(--panel2);padding:13px;border-radius:11px}
.stat b{display:block;font-size:20px;margin-top:7px}
.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0}
.tabs button{white-space:nowrap}
.tabs button.active{background:var(--gold);color:#241528}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:30px;padding:6px 10px;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.Active{background:#4bd88b}.Vacant{background:#f5c64d}.Inactive{background:#f0717e}
.stars{font-size:24px;color:var(--gold);letter-spacing:2px}
.hero{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.belt{width:100%;height:130px;object-fit:contain;background:#130e1d;border-radius:12px}
.placeholder{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--gold);font-weight:800;padding:12px}
.record{padding:13px 0;border-bottom:1px solid var(--line)}
.record:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--gold)}
.scroll{overflow-x:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
dialog{background:#1e162c;color:white;border:1px solid #725987;border-radius:16px;width:min(95vw,570px);max-height:88vh;overflow:auto;padding:20px}
dialog::backdrop{background:#000b}
dialog h2{color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{padding:11px;background:#32263e;border-radius:10px;font-size:13px;color:#ddd1e8}
@media(max-width:500px){.hero{grid-template-columns:1fr}.belt{height:160px}.two{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>
<body>
<header>
<div class="brand">🔮 MPW ENGAGED</div>
<a href="index.html">← Main Website</a>
</header>
<main>
<div class="flex">
<div><h1>🏆 Championships</h1><p>Lineage • Prestige • History • Records</p></div>
<button class="primary" onclick="editTitle()">+ Championship</button>
</div>
<div id="ranking"></div>
<div id="selector" class="tabs"></div>
<div id="content"></div>
</main>
<dialog id="modal">
<h2 id="modalTitle"></h2>
<div id="modalBody"></div>
<div class="actions">
<button class="primary" id="saveBtn">Save</button>
<button onclick="closeModal()">Cancel</button>
</div>
</dialog>
<script>
const KEY="mpw_championships_phase003";
const starter=[
{
id:"mpw",name:"MPW Championship",status:"Active",prestige:5,
champion:"Alexander Miles",image:"",notes:"",
reigns:[
["Daryl Draven",0,"Ultra-Showdown V",1,"1v1"],
["Aiden Miles",2,"Revenge",3,"1v1"],
["Alex Reynolds",1,"The Jungle",2,"Triple Threat"],
["Alexander Saint",1,"Sands of Time",6,"1v1"],
["Nemith Rivera",0,"Ultra-Showdown VI",1,"1v1"],
["Zach Moore",0,"Revenge",2,"1v1"],
["Daryl Draven",1,"No Holds Barred",3,"1v1 Falls Count Anywhere"],
["Alex Reynolds",1,"Sands of Time",3,"Triple Threat"],
["Aiden Miles",0,"Stairway to Heaven",3,"1v1"],
["Israel Keyes",0,"Ultra Showdown VII",1,"Triple Threat"],
["Alexander Miles",0,"Revenge",1,"1v1"]
].map((r,i)=>({id:"r"+i,name:r[0],members:"",defenses:r[1],event:r[2],months:r[3],type:r[4],notes:""})),
matches:[],log:[]
},
...["Heavyweight Championship","United States Championship","Intercontinental Championship","Light Heavyweight Championship","Television Championship","North American Championship","Hardcore Championship","Tag Team Championship","Trios Championships","Women's Championship"].map((name,i)=>({
id:"title"+i,name,status:"Active",prestige:0,champion:"",
image:"",notes:"",reigns:[],matches:[],log:[]
}))
];
let titles;
try{titles=JSON.parse(localStorage.getItem(KEY))||structuredClone(starter)}
catch(e){titles=structuredClone(starter)}
let selected=titles[0]?.id||"mpw",tab="lineage";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const current=()=>titles.find(t=>t.id===selected);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(titles))}catch(e){alert("Browser storage is full. Export your data.")}render()};
const stars=n=>{let out="";for(let i=1;i<=5;i++)out+=n>=i?"★":n>=i-.5?"⯪":"☆";return out};
const btn=(label,fn,cls="")=>`<button class="${cls}" onclick="${fn}">${label}</button>`;
function render(){
$("ranking").innerHTML=`<div class="card"><div class="flex"><h2>⭐ Championship Prestige Rankings</h2><span class="small">Current ratings</span></div>
${[...titles].sort((a,b)=>b.prestige-a.prestige||a.name.localeCompare(b.name)).map((t,i)=>`<div class="record flex"><span>${i+1}. ${esc(t.name)}</span><span class="gold">${stars(t.prestige)} ${Number(t.prestige).toFixed(1)}</span></div>`).join("")}</div>`;
$("selector").innerHTML=titles.map(t=>`<button class="${t.id===selected?"active":""}" onclick="choose('${t.id}')">${esc(t.name)}</button>`).join("");
let t=current();if(!t){$("content").innerHTML="";return}
const status=t.status||"Active";
let hero=`<div class="card">
<div class="flex"><h2>${esc(t.name)}</h2><span class="pill"><span class="dot ${esc(status)}"></span>${esc(status)}</span></div>
<div class="hero"><div>${t.image?`<img class="belt" src="${esc(t.image)}" alt="Championship belt" onerror="this.style.display='none'">`:`<div class="belt placeholder">🏆<br>MPW<br>CHAMPIONSHIP</div>`}</div>
<div><div class="small">CURRENT CHAMPION</div><h2>${esc(status==="Vacant"?"VACANT":t.champion||"Not entered")}</h2>
<div class="stars">${stars(t.prestige)}</div><div class="small">Prestige: ${Number(t.prestige).toFixed(1)} / 5</div>
<div class="actions">${btn("Edit Championship","editTitle()")}${btn("Adjust Prestige","editPrestige()")}${btn("Add Reign","editReign()")}</div></div></div></div>`;
let tabs=[["lineage","Title Lineage"],["matches","Title Match History"],["records","Records"],["log","Event Log"],["notes","Notes"]];
let nav=`<div class="tabs">${tabs.map(x=>`<button class="${tab===x[0]?"active":""}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join("")}</div>`;
$("content").innerHTML=hero+nav+section(t);
}
function choose(id){selected=id;tab="lineage";render()}
function setTab(x){tab=x;render()}
function section(t){
if(tab==="lineage"){
return `<div class="card"><div class="flex"><h2>Championship Lineage</h2>${btn("+ Add Reign","editReign()","primary")}</div>
${!t.reigns.length?`<p>No reigns entered yet.</p>`:`<div class="scroll"><table><thead><tr><th>#</th><th>Champion / Team</th><th>Defenses</th><th>Event Won</th><th>Months</th><th>Match Type</th><th></th></tr></thead><tbody>
${[...t.reigns].reverse().map((r,i)=>`<tr><td>${t.reigns.length-i}</td><td><b>${esc(r.name)}</b>${r.members?`<div class="small">${esc(r.members)}</div>`:""}</td><td>${r.defenses}</td><td>${esc(r.event)}</td><td>${r.months}</td><td>${esc(r.type)}</td><td>${btn("Edit",`editReign('${r.id}')`)}</td></tr>`).join("")}</tbody></table></div>`}</div>`;
}
if(tab==="records"){
const r=t.reigns,counts={},months={},defs={};
r.forEach(x=>{counts[x.name]=(counts[x.name]||0)+1;months[x.name]=(months[x.name]||0)+Number(x.months||0);defs[x.name]=(defs[x.name]||0)+Number(x.defenses||0)});
const leaders=(obj)=>{let m=Math.max(0,...Object.values(obj));return m?Object.keys(obj).filter(k=>obj[k]===m).join(", ")+" — "+m:"Not available"};
const longest=r.length?[...r].sort((a,b)=>b.months-a.months)[0]:null;
const shortest=r.length?[...r].sort((a,b)=>a.months-b.months)[0]:null;
const mostDef=r.length?[...r].sort((a,b)=>b.defenses-a.defenses)[0]:null;
const cards=[
["Recorded Reigns",r.length],["Recorded Title Matches",t.matches.length],
["First Champion",r[0]?.name||"Unknown"],["Most Reigns",leaders(counts)],
["Longest Single Reign",longest?longest.name+" — "+longest.months+" months":"Unknown"],
["Shortest Reign",shortest?shortest.name+" — "+shortest.months+" months":"Unknown"],
["Most Combined Months",leaders(months)],
["Most Career Defenses",leaders(defs)],
["Most Defenses in One Reign",mostDef?mostDef.name+" — "+mostDef.defenses:"Unknown"],
["Current Prestige",t.prestige+"/5"],
["Highest Recorded Prestige",Math.max(t.prestige,...t.log.filter(x=>x.rating!==null&&x.rating!==undefined).map(x=>Number(x.rating)))+"/5"]
];
return `<div class="card"><h2>Championship Records</h2><div class="grid">${cards.map(c=>`<div class="stat"><div class="small">${esc(c[0])}</div><b>${esc(c[1])}</b></div>`).join("")}</div><p class="small">Records are calculated from entered data. Missing historical matches are not counted as zero.</p></div>`;
}
if(tab==="matches"){
return `<div class="card"><div class="flex"><h2>Title Match History</h2>${btn("+ Title Match","editMatch()","primary")}</div>
${!t.matches.length?"<p>No title matches recorded yet. Historical opponents can be added whenever you know them.</p>":t.matches.map(m=>`<div class="record"><b>${esc(m.event||"Event unknown")}</b><div>${esc(m.participants)}</div><div class="small">Champion entering: ${esc(m.entering)} | ${esc(m.type)}</div><div class="gold">Winner: ${esc(m.winner)} • ${esc(m.outcome)}</div>${m.notes?`<p>${esc(m.notes)}</p>`:""}${btn("Edit",`editMatch('${m.id}')`)}</div>`).join("")}</div>`;
}
if(tab==="log"){
return `<div class="card"><div class="flex"><h2>Championship Event Log</h2>${btn("+ Log Entry","editLog()","primary")}</div>
${!t.log.length?"<p>No events logged yet. Track promos, confrontations, defenses, title changes, vacancies, and prestige shifts here.</p>":t.log.map(e=>`<div class="record"><div class="flex"><b>${esc(e.event||"Event not specified")}</b><span class="pill">${esc(e.type)}</span></div><p>${esc(e.description)}</p><div class="small">${esc(e.people||"")}${e.rating!==null&&e.rating!==undefined?" • Prestige: "+e.rating+"/5":""}</div>${btn("Edit",`editLog('${e.id}')`)}</div>`).join("")}</div>`;
}
return `<div class="card"><h2>Championship Notes</h2><p style="white-space:pre-wrap">${esc(t.notes||"No notes yet.")}</p>${btn("Edit Notes","editNotes()")}</div>`;
}
function openModal(title,body,onSave){
$("modalTitle").textContent=title;$("modalBody").innerHTML=body;
$("saveBtn").onclick=onSave;$("modal").showModal();
}
function closeModal(){$("modal").close()}
function field(label,id,value="",type="text"){
return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}">`;
}
function choice(label,id,options,value){
return `<label for="${id}">${label}</label><select id="${id}">${options.map(o=>`<option ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
}
function val(id){return $(id).value.trim()}
function editTitle(){
let t=current(),adding=!t;
openModal(adding?"Add Championship":"Edit Championship",
field("Championship Name","fName",t?.name)+
field("Belt Image URL","fImage",t?.image)+
field("Current Champion / Team","fChampion",t?.champion)+
choice("Status","fStatus",["Active","Vacant","Inactive"],t?.status||"Active")+
`<p class="small">Add title reigns separately to preserve full lineage.</p>`,
()=>{
let name=val("fName");if(!name)return alert("Enter a championship name.");
if(adding){t={id:uid(),name,image:"",champion:"",status:"Active",prestige:0,notes:"",reigns:[],matches:[],log:[]};titles.push(t);selected=t.id}
t.name=name;t.image=val("fImage");t.champion=val("fChampion");t.status=val("fStatus");
closeModal();save();
});
}
function editPrestige(){
let t=current();
openModal("Adjust Championship Prestige",
`<p>Rate the championship itself, not its champion. Changes are manual.</p>
<label>Current prestige (0–5, half-star increments)</label>
<select id="fRating">${Array.from({length:11},(_,i)=>i*.5).map(n=>`<option value="${n}" ${n===Number(t.prestige)?"selected":""}>${n.toFixed(1)} stars</option>`).join("")}</select>
${field("Reason for change (optional)","fReason")}
${field("Event (optional)","fEvent")}`,
()=>{
let old=Number(t.prestige),next=Number(val("fRating"));
t.prestige=next;
if(next!==old)t.log.unshift({id:uid(),event:val("fEvent"),type:"Prestige Change",description:val("fReason")||`Prestige changed from ${old} to ${next} stars`,people:"",rating:next});
closeModal();save();
});
}
function editReign(id){
let t=current(),r=t.reigns.find(x=>x.id===id),adding=!r;
openModal(adding?"Add Championship Reign":"Edit Championship Reign",
field("Champion / Team","fName",r?.name)+field("Team Members (if applicable)","fMembers",r?.members)+
field("Successful Defenses","fDef",r?.defenses??0,"number")+
field("Event Won (PPV or Engage)","fEvent",r?.event)+
field("Months Held (decimals allowed)","fMonths",r?.months??0,"number")+
field("Match Type Won","fType",r?.type)+field("Notes","fNotes",r?.notes)+
(adding?"<p class='small'>New reigns are added after existing reigns.</p>":""),
()=>{
if(!val("fName"))return alert("Enter the champion or team.");
if(!r){r={id:uid()};t.reigns.push(r)}
Object.assign(r,{name:val("fName"),members:val("fMembers"),defenses:Math.max(0,Number(val("fDef"))||0),event:val("fEvent"),months:Math.max(0,Number(val("fMonths"))||0),type:val("fType"),notes:val("fNotes")});
if(adding){t.champion=r.name;t.status="Active"}
closeModal();save();
});
$("fMonths").step="0.5";$("fMonths").min="0";$("fDef").min="0";
}
function editMatch(id){
let t=current(),m=t.matches.find(x=>x.id===id);
openModal(m?"Edit Title Match":"Add Title Match",
field("Event","fEvent",m?.event)+field("Participants / Opponents","fPeople",m?.participants)+
field("Champion Entering","fEntering",m?.entering)+field("Match Type","fType",m?.type)+
field("Winner","fWinner",m?.winner)+
choice("Outcome","fOutcome",["Retained","Title Changed","Vacant Title Won","Other"],m?.outcome||"Retained")+
field("Notes","fNotes",m?.notes),
()=>{
if(!m){m={id:uid()};t.matches.push(m)}
Object.assign(m,{event:val("fEvent"),participants:val("fPeople"),entering:val("fEntering"),type:val("fType"),winner:val("fWinner"),outcome:val("fOutcome"),notes:val("fNotes")});
closeModal();save();
});
}
function editLog(id){
let t=current(),e=t.log.find(x=>x.id===id);
openModal(e?"Edit Event Log":"Add Championship Event",
field("Event / Show","fEvent",e?.event)+
choice("Event Type","fType",["Promo","Confrontation","Title Defense","Title Change","Vacancy","Tournament","Injury","Prestige Change","Other"],e?.type||"Promo")+
field("Involved Wrestlers","fPeople",e?.people)+
`<label>Description</label><textarea id="fDesc">${esc(e?.description||"")}</textarea>`,
()=>{
if(!e){e={id:uid(),rating:null};t.log.unshift(e)}
Object.assign(e,{event:val("fEvent"),type:val("fType"),people:val("fPeople"),description:val("fDesc")});
closeModal();save();
});
}
function editNotes(){
let t=current();
openModal("Championship Notes",`<textarea id="fNotes">${esc(t.notes)}</textarea>`,()=>{
t.notes=val("fNotes");closeModal();save();
});
}
render();
</script>
</body>
</html>
