
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPW ENGAGED | Event Hub</title>
<style>
  :root {
    --gold: #c8a85b;
    --purple: #281038;
    --background: #0c0a10;
    --card: #1b1424;
    --text: #f6f0f7;
  }
  body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font-family: Arial, sans-serif;
  }
  header {
    background: var(--purple);
    border-bottom: 2px solid var(--gold);
    padding: 24px;
    text-align: center;
  }
  h1 { color: var(--gold); }
  main {
    max-width: 1000px;
    padding: 24px;
    margin: auto;
  }
  section { margin: 30px 0; }
  input, textarea {
    padding: 10px;
    margin: 5px;
    max-width: 100%;
    box-sizing: border-box;
  }
  button {
    padding: 9px 13px;
    margin: 4px;
    border-radius: 5px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .gold-button {
    background: var(--gold);
    color: #17101b;
    border: none;
    font-weight: bold;
  }
  .purple-button {
    background: #372047;
    border: 1px solid var(--gold);
    color: white;
  }
  .danger-button {
    background: #49212c;
    border: 1px solid #a84a5a;
    color: white;
  }
  .event-card, .match-card {
    background: var(--card);
    border: 1px solid #49345a;
    border-left: 4px solid var(--gold);
    border-radius: 8px;
    padding: 16px;
    margin: 12px 0;
  }
  .event-card h3, .match-card h4 {
    margin: 6px 0 10px;
  }
  .position, .status {
    color: var(--gold);
    font-weight: bold;
    font-size: 13px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 12px;
  }
  .muted { color: #c3b7c9; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>MPW ENGAGED</h1>
  <p>SHOWS & MATCH CARDS</p>
</header>

<main>
  <h2>Event Hub</h2>
  <p class="muted">Official MPW shows and match cards</p>
  <div id="event-list">Loading events...</div>

  <section id="event-drafts" hidden>
    <h2>My Event Drafts</h2>
    <div id="draft-list">Loading drafts...</div>
  </section>

  <section id="event-details" hidden>
    <h2 id="selected-event-title">Event Management</h2>
    <p id="selected-event-info"></p>
    <p id="selected-event-status" class="status"></p>

    <div id="publishing-controls" hidden>
      <button id="publish-event-btn"
        class="gold-button" type="button">
        Publish Event
      </button>
      <button id="unpublish-event-btn"
        class="purple-button" type="button" hidden>
        Unpublish Event
      </button>
    </div>

    <h3>Match Card</h3>
    <div id="selected-event-matches">
      No matches added yet.
    </div>

    <div id="match-booking-section" hidden>
      <h3>Book a Match</h3>
      <div id="match-booking">
        <input id="match-name" type="text"
          placeholder="Match Name">
        <input id="match-type" type="text"
          placeholder="Match Type">
        <input id="match-order" type="number" min="1"
          placeholder="Match Order (1 = Opener)">
        <button id="add-match-btn"
          class="gold-button" type="button">
          Add Match
        </button>
      </div>
    </div>
  </section>

  <section id="event-admin" hidden>
    <h2>Create Event</h2>
    <input id="event-title" type="text"
      placeholder="Event Name">
    <input id="event-type" type="text"
      placeholder="Event Type (Engage, PLE, etc.)">
    <input id="event-date" type="date">
    <input id="event-location" type="text"
      placeholder="Event Location">
    <textarea id="event-description"
      placeholder="Event Description"></textarea>
    <button id="create-event-btn"
      class="gold-button" type="button">
      Create Event
    </button>
  </section>
</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getFirestore, collection, query, where,
  getDocs, addDoc, doc, getDoc, deleteDoc,
  updateDoc, writeBatch
} from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import { getAuth, onAuthStateChanged } from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB44fs1SVXQ0qEubJKO5OPM2b-5l_c0ViA",
  authDomain: "mpw-engaged.firebaseapp.com",
  projectId: "mpw-engaged",
  storageBucket: "mpw-engaged.firebasestorage.app",
  messagingSenderId: "133272625859",
  appId: "1:133272625859:web:d1e09eaf1b4613172a7876"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let selectedEventId = null;
let selectedEventStatus = null;
let isAdmin = false;
let reorderingMatches = false;
let savingStatus = false;

const el = id => document.getElementById(id);

function sortMatches(docs) {
  return [...docs].sort((a, b) => {
    const difference =
      (Number(b.data().order) || 0) -
      (Number(a.data().order) || 0);

    if (difference) return difference;

    const aDate = a.data().createdAt || "";
    const bDate = b.data().createdAt || "";

    return aDate.localeCompare(bDate) ||
      a.id.localeCompare(b.id);
  });
}

function makeButton(text, className, action) {
  const button = document.createElement("button");
  button.textContent = text;
  button.className = className;
  button.type = "button";
  button.addEventListener("click", action);
  return button;
}

function updateManagementControls() {
  const canManage = isAdmin &&
    selectedEventId !== null;

  el("publishing-controls").hidden = !canManage;
  el("match-booking-section").hidden = !canManage;

  el("publish-event-btn").hidden =
    selectedEventStatus !== "draft";

  el("unpublish-event-btn").hidden =
    selectedEventStatus !== "published";

  el("selected-event-status").textContent =
    selectedEventStatus === "published"
      ? "PUBLISHED — Official MPW Event"
      : "DRAFT — Not Publicly Announced";
}

async function openEvent(eventId) {
  selectedEventId = eventId;
  el("event-details").hidden = false;
  el("selected-event-title").textContent =
    "Loading event...";

  try {
    const snapshot = await getDoc(
      doc(db, "events", eventId)
    );

    if (selectedEventId !== eventId) return;

    if (!snapshot.exists()) {
      throw new Error("Event not found.");
    }

    const event = snapshot.data();

    // Never show a private draft to a public visitor.
    if (event.publicationStatus !== "published" &&
        !isAdmin) {
      el("event-details").hidden = true;
      throw new Error("This event is not public.");
    }

    selectedEventStatus = event.publicationStatus;

    el("selected-event-title").textContent =
      event.title || "Untitled Event";

    el("selected-event-info").textContent =
      `${event.type || "Event"} | ` +
      `${event.date || "Date TBD"} | ` +
      `${event.location || "Location TBD"}`;

    updateManagementControls();
    await loadMatches(eventId);

    el("event-details").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } catch (error) {
    console.error("Opening event failed:", error);
    alert("Unable to open event: " + error.message);
  }
}

function makeEventCard(eventDoc, isDraft = false) {
  const event = eventDoc.data();
  const card = document.createElement("article");
  card.className = "event-card";

  const heading = document.createElement("h3");
  heading.textContent = event.title || "Untitled Event";
  card.appendChild(heading);

  const info = document.createElement("p");
  info.textContent =
    `${event.type || "Event"} | ` +
    `${event.date || "Date TBD"} | ` +
    `${event.location || "Location TBD"}`;
  card.appendChild(info);

  const status = document.createElement("p");
  status.className = "status";
  status.textContent = isDraft ? "DRAFT" : "PUBLISHED";
  card.appendChild(status);

  card.appendChild(makeButton(
    isAdmin ? "Manage Event" : "View Match Card",
    "gold-button",
    () => openEvent(eventDoc.id)
  ));

  return card;
}

async function loadEvents() {
  const eventList = el("event-list");
  eventList.textContent = "Loading events...";

  try {
    const snapshot = await getDocs(query(
      collection(db, "events"),
      where("publicationStatus", "==", "published")
    ));

    eventList.textContent = "";

    if (snapshot.empty) {
      eventList.textContent = "No published events yet.";
      return;
    }

    snapshot.forEach(eventDoc => {
      eventList.appendChild(makeEventCard(eventDoc));
    });

  } catch (error) {
    console.error("Event loading failed:", error);
    eventList.textContent = "Unable to load events.";
  }
}

async function loadDrafts() {
  if (!isAdmin) return;

  const draftList = el("draft-list");
  draftList.textContent = "Loading drafts...";

  try {
    const snapshot = await getDocs(query(
      collection(db, "events"),
      where("publicationStatus", "==", "draft")
    ));

    draftList.textContent = "";

    if (snapshot.empty) {
      draftList.textContent = "No event drafts yet.";
      return;
    }

    snapshot.forEach(eventDoc => {
      draftList.appendChild(
        makeEventCard(eventDoc, true)
      );
    });

  } catch (error) {
    console.error("Draft loading failed:", error);
    draftList.textContent = "Unable to load drafts.";
  }
}

async function loadMatches(eventId) {
  const list = el("selected-event-matches");
  list.textContent = "Loading matches...";

  try {
    const snapshot = await getDocs(
      collection(db, "events", eventId, "matches")
    );

    if (selectedEventId !== eventId) return;

    const matches = sortMatches(snapshot.docs);
    list.textContent = "";

    if (!matches.length) {
      list.textContent = "No matches added yet.";
      return;
    }

    matches.forEach((matchDoc, index) => {
      const match = matchDoc.data();
      const card = document.createElement("article");
      card.className = "match-card";

      const position = document.createElement("p");
      position.className = "position";

      const order = Number(match.order);
      const validOrder =
        Number.isSafeInteger(order) && order >= 1;

      const label = index === 0 && matches.length > 1
        ? "MAIN EVENT"
        : index === matches.length - 1 &&
          matches.length > 1
          ? "OPENER"
          : "MATCH";

      position.textContent =
        label + " — " +
        (validOrder ? "MATCH " + order : "ORDER NOT ASSIGNED");

      card.appendChild(position);

      const heading = document.createElement("h4");
      heading.textContent = match.name || "Unnamed Match";
      card.appendChild(heading);

      const type = document.createElement("p");
      type.textContent = match.type || "Standard Match";
      card.appendChild(type);

      // Public visitors only see the match information.
      if (isAdmin) {
        const controls = document.createElement("div");
        controls.className = "controls";

        const up = makeButton(
          "↑ Move Up", "purple-button",
          () => moveMatch(eventId, matchDoc.id, -1)
        );
        up.disabled = index === 0;
        controls.appendChild(up);

        const down = makeButton(
          "↓ Move Down", "purple-button",
          () => moveMatch(eventId, matchDoc.id, 1)
        );
        down.disabled = index === matches.length - 1;
        controls.appendChild(down);

        controls.appendChild(makeButton(
          "Edit Match", "gold-button",
          async () => {
            const name = prompt(
              "Edit Match Name:", match.name || ""
            );
            if (name === null) return;

            const type = prompt(
              "Edit Match Type:", match.type || ""
            );
            if (type === null) return;

            const orderInput = prompt(
              "Match Order (1 = Opener):",
              validOrder ? String(order) : ""
            );
            if (orderInput === null) return;

            const newOrder = Number(orderInput.trim());

            if (!name.trim() || !type.trim() ||
                orderInput.trim() === "" ||
                !Number.isSafeInteger(newOrder) ||
                newOrder < 1) {
              alert("Enter a valid name, type, and match order.");
              return;
            }

            try {
              await updateDoc(
                doc(db, "events", eventId,
                    "matches", matchDoc.id),
                {
                  name: name.trim(),
                  type: type.trim(),
                  order: newOrder
                }
              );

              await loadMatches(eventId);
              alert("Match updated successfully!");

            } catch (error) {
              alert("Unable to update match: " + error.message);
            }
          }
        ));

        controls.appendChild(makeButton(
          "Delete Match", "danger-button",
          async () => {
            if (!confirm("Delete this match?")) return;

            try {
              await deleteDoc(
                doc(db, "events", eventId,
                    "matches", matchDoc.id)
              );
              await loadMatches(eventId);
            } catch (error) {
              alert("Unable to delete match: " + error.message);
            }
          }
        ));

        card.appendChild(controls);
      }

      list.appendChild(card);
    });

  } catch (error) {
    console.error("Match loading failed:", error);
    list.textContent = "Unable to load matches.";
  }
}

async function moveMatch(eventId, matchId, direction) {
  if (!isAdmin || reorderingMatches) return;

  reorderingMatches = true;

  try {
    const snapshot = await getDocs(
      collection(db, "events", eventId, "matches")
    );

    const matches = sortMatches(snapshot.docs);
    const index = matches.findIndex(
      item => item.id === matchId
    );
    const target = index + direction;

    if (index < 0 || target < 0 ||
        target >= matches.length) return;

    [matches[index], matches[target]] =
      [matches[target], matches[index]];

    // Firestore batches are limited, so save in chunks.
    for (let start = 0; start < matches.length; start += 400) {
      const batch = writeBatch(db);

      matches.slice(start, start + 400).forEach(
        (matchDoc, offset) => {
          const i = start + offset;

          batch.update(
            doc(db, "events", eventId,
                "matches", matchDoc.id),
            { order: matches.length - i }
          );
        }
      );

      await batch.commit();
    }

    await loadMatches(eventId);

  } catch (error) {
    alert("Unable to reorder matches: " + error.message);
    await loadMatches(eventId);
  } finally {
    reorderingMatches = false;
  }
}

async function changePublicationStatus(newStatus) {
  if (!isAdmin || !selectedEventId || savingStatus) return;

  const eventId = selectedEventId;
  const action = newStatus === "published"
    ? "publish"
    : "unpublish";

  if (!confirm(
    `Are you sure you want to ${action} this event?`
  )) return;

  savingStatus = true;

  try {
    await updateDoc(doc(db, "events", eventId), {
      publicationStatus: newStatus
    });

    selectedEventStatus = newStatus;
    updateManagementControls();

    await Promise.all([
      loadEvents(),
      loadDrafts()
    ]);

    alert(
      newStatus === "published"
        ? "Event published successfully!"
        : "Event returned to drafts!"
    );

  } catch (error) {
    alert(
      "Unable to change event status: " + error.message
    );
  } finally {
    savingStatus = false;
  }
}

el("publish-event-btn").addEventListener(
  "click",
  () => changePublicationStatus("published")
);

el("unpublish-event-btn").addEventListener(
  "click",
  () => changePublicationStatus("draft")
);

el("add-match-btn").addEventListener(
  "click",
  async () => {
    if (!isAdmin || !selectedEventId) {
      alert("Select an event as an admin first.");
      return;
    }

    const name = el("match-name").value.trim();
    const type = el("match-type").value.trim();
    const orderInput = el("match-order").value.trim();
    const order = Number(orderInput);

    if (!name || !type ||
        orderInput === "" ||
        !Number.isSafeInteger(order) ||
        order < 1) {
      alert("Enter a valid name, type, and match order.");
      return;
    }

    try {
      await addDoc(
        collection(db, "events",
                   selectedEventId, "matches"),
        {
          name,
          type,
          order,
          createdAt: new Date().toISOString()
        }
      );

      el("match-name").value = "";
      el("match-type").value = "";
      el("match-order").value = "";

      await loadMatches(selectedEventId);
      alert("Match added successfully!");

    } catch (error) {
      alert("Unable to add match: " + error.message);
    }
  }
);

el("create-event-btn").addEventListener(
  "click",
  async () => {
    if (!isAdmin || !auth.currentUser) {
      alert("Only active admins can create events.");
      return;
    }

    const title = el("event-title").value.trim();
    const type = el("event-type").value.trim();
    const date = el("event-date").value;
    const location = el("event-location").value.trim();
    const description =
      el("event-description").value.trim();

    if (!title || !type || !date) {
      alert("Enter an event name, type, and date.");
      return;
    }

    try {
      await addDoc(collection(db, "events"), {
        title,
        type,
        date,
        location,
        description,
        authorUid: auth.currentUser.uid,
        publicationStatus: "draft"
      });

      el("event-title").value = "";
      el("event-type").value = "";
      el("event-date").value = "";
      el("event-location").value = "";
      el("event-description").value = "";

      await loadDrafts();
      alert("Event draft created successfully!");

    } catch (error) {
      alert("Unable to create event: " + error.message);
    }
  }
);

onAuthStateChanged(auth, async user => {
  isAdmin = false;

  el("event-admin").hidden = true;
  el("event-drafts").hidden = true;

  if (user) {
    try {
      const profile = await getDoc(
        doc(db, "users", user.uid)
      );

      isAdmin = profile.exists() &&
        profile.data().active === true &&
        profile.data().role === "admin";

    } catch (error) {
      console.error("Admin verification failed:", error);
    }
  }

  el("event-admin").hidden = !isAdmin;
  el("event-drafts").hidden = !isAdmin;

  // Clear private details when authentication changes.
  selectedEventId = null;
  selectedEventStatus = null;
  el("event-details").hidden = true;

  await loadEvents();

  if (isAdmin) {
    await loadDrafts();
  }
});
</script>
</body>
</html>
