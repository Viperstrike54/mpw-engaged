<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPW ENGAGED | Event Hub</title>
  <style>
    body {
      margin: 0;
      background: #0c0a10;
      color: #f6f0f7;
      font-family: Arial, sans-serif;
    }
    header {
      background: #281038;
      border-bottom: 2px solid #c8a85b;
      padding: 24px;
      text-align: center;
    }
    h1 { color: #c8a85b; }
    main { padding: 24px; max-width: 1000px; margin: auto; }
  </style>
</head>
<body>
  <header>
    <h1>MPW ENGAGED</h1>
    <p>SHOWS & MATCH CARDS</p>
  </header>
  <main>
    <h2>Event Hub</h2><div id="event-list">Loading events...</div>

<section id="event-drafts" hidden>
  <h2>My Event Drafts</h2>
  <div id="draft-list">Loading drafts...</div>
</section>
<section id="event-details" hidden>
  <h2 id="selected-event-title">Event Management</h2>
  <p id="selected-event-info"></p>
  <h3>Match Card</h3>
  <div id="selected-event-matches">
    No matches added yet.
  </div>
<h3>Book a Match</h3>
<div id="match-booking">
  <input id="match-name" type="text" placeholder="Match Name" />
  <input id="match-type" type="text" placeholder="Match Type" />
  <button id="add-match-btn" type="button">Add Match</button>
</div>
</section>
    <section id="event-admin" hidden>
  <h2>Create Event</h2>
  <input id="event-title" type="text" placeholder="Event Name" />
  <input id="event-type" type="text" placeholder="Event Type (Engage, PLE, etc.)" />
  <input id="event-date" type="date" />
  <input id="event-location" type="text" placeholder="Event Location" />
<textarea id="event-description" placeholder="Event Description"></textarea>
<button id="create-event-btn" type="button">Create Event</button>
</section>
  </main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import { getFirestore, collection, query, where, getDocs, addDoc, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB44fs1SVXQ0qEubJKO5OPM2b-5l_c0ViA",
    authDomain: "mpw-engaged.firebaseapp.com",
    projectId: "mpw-engaged",
    storageBucket: "mpw-engaged.firebasestorage.app",
    messagingSenderId: "133272625859",
    appId: "1:133272625859:web:d1e09eaf1b4613172a7876"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

const auth = getAuth(app);
let selectedEventId = null;
  async function loadEvents() {
    const eventList = document.getElementById("event-list");
    try {
      const publishedEvents = query(
        collection(db, "events"),
        where("publicationStatus", "==", "published")
      );
      const snapshot = await getDocs(publishedEvents);
      eventList.textContent = "";
      if (snapshot.empty) {
        eventList.textContent = "No published events yet.";
        return;
      }
      snapshot.forEach(doc => {
        const event = doc.data();
        const card = document.createElement("article");
        const heading = document.createElement("h3");
        heading.textContent = event.title || "Untitled event";
        card.appendChild(heading);
        eventList.appendChild(card);
      });
    } catch (error) {
      console.error("Event loading failed:", error);
      eventList.textContent = "Unable to load events.";
    }
  }

async function loadMatches(eventId) {
  const matchList = document.getElementById("selected-event-matches");
  matchList.textContent = "Loading matches...";

  try {
    const matchesQuery = query(
      collection(db, "events", eventId, "matches")
    );

    const snapshot = await getDocs(matchesQuery);
    matchList.textContent = "";

    if (snapshot.empty) {
      matchList.textContent = "No matches added yet.";
      return;
    }

    snapshot.forEach(matchDoc => {
      const match = matchDoc.data();
      const card = document.createElement("article");
      const heading = document.createElement("h4");

      heading.textContent = match.name || "Unnamed Match";
      card.appendChild(heading);

      const type = document.createElement("p");
      type.textContent = match.type || "Standard Match";
      card.appendChild(type);
const deleteButton = document.createElement("button");
deleteButton.textContent = "Delete Match";

deleteButton.addEventListener("click", async () => {
  if (!confirm("Are you sure you want to delete this match?")) return;

  try {
    await deleteDoc(doc(db, "events", eventId, "matches", matchDoc.id));
    await loadMatches(eventId);
  } catch (error) {
    alert("Unable to delete match: " + error.message);
  }
});

card.appendChild(deleteButton);
      matchList.appendChild(card);
    });
  } catch (error) {
    console.error("Match loading failed:", error);
    matchList.textContent = "Unable to load matches.";
  }
}

async function loadDrafts() {
  const draftList = document.getElementById("draft-list");

const draftsQuery = query(
  collection(db, "events"),
  where("publicationStatus", "==", "draft")
);
const snapshot = await getDocs(draftsQuery);
  
draftList.textContent = "";

if (snapshot.empty) {
  draftList.textContent = "No event drafts yet.";
  return;
}


snapshot.forEach(doc => {
  const event = doc.data();
  const card = document.createElement("article");
  const heading = document.createElement("h3");

  heading.textContent = event.title || "Untitled Event";
  heading.style.cursor = "pointer";
heading.style.color = "#c8a85b";
heading.addEventListener("click", () => {
selectedEventId = doc.id;
  document.getElementById("event-details").hidden = false;

  document.getElementById("selected-event-title").textContent =
    event.title || "Untitled Event";

  document.getElementById("selected-event-info").textContent =
    `${event.type || "Event"} | ${event.date || "Date TBD"} | ${event.location || "Location TBD"}`;
  loadMatches(selectedEventId);
});
  card.appendChild(heading);
  draftList.appendChild(card);
});

}

  
onAuthStateChanged(auth, async (user) => {
  const adminSection = document.getElementById("event-admin");
 
const draftsSection = document.getElementById("event-drafts");

  adminSection.hidden = true;

draftsSection.hidden = true;

  if (!user) return;

  try {
    const profile = await getDoc(doc(db, "users", user.uid));
    adminSection.hidden =
      !(profile.exists() &&
        profile.data().active === true &&
        profile.data().role === "admin");
  
draftsSection.hidden = adminSection.hidden;

if (!draftsSection.hidden) {
  await loadDrafts();
}

  } catch (error) {
    console.error("Admin verification failed:", error);
  }
});

document.getElementById("add-match-btn").addEventListener("click", async () => {
  if (!selectedEventId) {
    alert("Please select an event first.");
    return;
  }

  const name = document.getElementById("match-name").value.trim();
  const type = document.getElementById("match-type").value.trim();

  if (!name || !type) {
    alert("Please enter a match name and match type.");
    return;
  }

  try {
    await addDoc(collection(db, "events", selectedEventId, "matches"), {
      name,
      type,
      createdAt: new Date().toISOString()
    });

    alert("Match added successfully!");
  } catch (error) {
    console.error("Match booking failed:", error);
    alert("Unable to add match: " + error.message);
  }
});
  
document.getElementById("create-event-btn").addEventListener("click", async () => {
  const title = document.getElementById("event-title").value.trim();
  const type = document.getElementById("event-type").value.trim();
  const date = document.getElementById("event-date").value;
  const location = document.getElementById("event-location").value.trim();
  const description = document.getElementById("event-description").value.trim();

  if (!title || !type || !date) {
    alert("Please enter an event name, type, and date.");
    return;
  }

  const user = auth.currentUser;
  if (!user) {
    alert("Please sign in before creating an event.");
    return;
  }

  try {
    const profile = await getDoc(doc(db, "users", user.uid));
    if (!profile.exists() || profile.data().active !== true || profile.data().role !== "admin") {
      alert("Only an active admin can create events.");
      return;
    }

    await addDoc(collection(db, "events"), {
      title,
      type,
      date,
      location,
      description,
      authorUid: user.uid,
      publicationStatus: "draft"
    });

    alert("Event draft created successfully!");
  } catch (error) {
    console.error("Event creation failed:", error);
    alert("Unable to create event: " + error.message);
  }
});

  loadEvents();
</script>
</body>
</html>
