
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPW ENGAGED | Event Hub</title>
  <style>
    body {
      margin: 0;
      background: #0c0a10;
      color: #f6f0f7;
      font-family: Arial, sans-serif;
    }

    header {
      background: #281038;
      border-bottom: 2px solid #c8a85b;
      padding: 24px;
      text-align: center;
    }

    h1 { color: #c8a85b; }

    main {
      padding: 24px;
      max-width: 1000px;
      margin: auto;
    }

    input, textarea {
      padding: 9px;
      margin: 4px 4px 4px 0;
      max-width: 100%;
      box-sizing: border-box;
    }

    button {
      padding: 8px 12px;
      margin: 4px 5px 4px 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .match-card {
      background: #1b1424;
      border: 1px solid #49345a;
      border-left: 4px solid #c8a85b;
      border-radius: 8px;
      padding: 14px;
      margin: 12px 0;
    }

    .match-card h4 {
      margin: 5px 0;
      color: #f6f0f7;
    }

    .match-position {
      color: #c8a85b;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 0.4px;
    }

    .match-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 12px;
    }

    .move-button {
      background: #372047;
      border: 1px solid #c8a85b;
      color: #f6f0f7;
      border-radius: 5px;
    }

    .edit-button {
      background: #c8a85b;
      border: none;
      color: #17101b;
      border-radius: 5px;
    }

    .delete-button {
      background: #49212c;
      border: 1px solid #a84a5a;
      color: #ffffff;
      border-radius: 5px;
    }

    .event-draft {
      padding: 10px 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>MPW ENGAGED</h1>
    <p>SHOWS & MATCH CARDS</p>
  </header>

  <main>
    <h2>Event Hub</h2>
    <div id="event-list">Loading events...</div>

    <section id="event-drafts" hidden>
      <h2>My Event Drafts</h2>
      <div id="draft-list">Loading drafts...</div>
    </section>

    <section id="event-details" hidden>
      <h2 id="selected-event-title">Event Management</h2>
      <p id="selected-event-info"></p>

      <h3>Match Card</h3>
      <div id="selected-event-matches">
        No matches added yet.
      </div>

      <h3>Book a Match</h3>
      <div id="match-booking">
        <input id="match-name" type="text"
          placeholder="Match Name" />

        <input id="match-type" type="text"
          placeholder="Match Type" />

        <input id="match-order" type="number" min="1"
          placeholder="Match Order (1 = Opener)" />

        <button id="add-match-btn" type="button">
          Add Match
        </button>
      </div>
    </section>

    <section id="event-admin" hidden>
      <h2>Create Event</h2>

      <input id="event-title" type="text"
        placeholder="Event Name" />

      <input id="event-type" type="text"
        placeholder="Event Type (Engage, PLE, etc.)" />

      <input id="event-date" type="date" />

      <input id="event-location" type="text"
        placeholder="Event Location" />

      <textarea id="event-description"
        placeholder="Event Description"></textarea>

      <button id="create-event-btn" type="button">
        Create Event
      </button>
    </section>
  </main>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      addDoc,
      doc,
      getDoc,
      deleteDoc,
      updateDoc,
      writeBatch
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB44fs1SVXQ0qEubJKO5OPM2b-5l_c0ViA",
      authDomain: "mpw-engaged.firebaseapp.com",
      projectId: "mpw-engaged",
      storageBucket: "mpw-engaged.firebasestorage.app",
      messagingSenderId: "133272625859",
      appId: "1:133272625859:web:d1e09eaf1b4613172a7876"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let selectedEventId = null;
    let reorderingMatches = false;

    function sortMatches(matchDocs) {
      return [...matchDocs].sort((a, b) => {
        const aOrder = Number(a.data().order) || 0;
        const bOrder = Number(b.data().order) || 0;

        if (aOrder !== bOrder) {
          return bOrder - aOrder;
        }

        const aDate = a.data().createdAt || "";
        const bDate = b.data().createdAt || "";

        if (aDate !== bDate) {
          return aDate.localeCompare(bDate);
        }

        return a.id.localeCompare(b.id);
      });
    }

    async function loadEvents() {
      const eventList = document.getElementById("event-list");

      try {
        const publishedEvents = query(
          collection(db, "events"),
          where("publicationStatus", "==", "published")
        );

        const snapshot = await getDocs(publishedEvents);
        eventList.textContent = "";

        if (snapshot.empty) {
          eventList.textContent = "No published events yet.";
          return;
        }

        snapshot.forEach(eventDoc => {
          const event = eventDoc.data();
          const card = document.createElement("article");
          const heading = document.createElement("h3");

          heading.textContent =
            event.title || "Untitled event";

          card.appendChild(heading);
          eventList.appendChild(card);
        });
      } catch (error) {
        console.error("Event loading failed:", error);
        eventList.textContent = "Unable to load events.";
      }
    }

    async function moveMatch(eventId, matchId, direction) {
      if (reorderingMatches) return;

      reorderingMatches = true;

      const matchList = document.getElementById(
        "selected-event-matches"
      );

      try {
        const snapshot = await getDocs(
          collection(db, "events", eventId, "matches")
        );

        const matches = sortMatches(snapshot.docs);

        const currentIndex = matches.findIndex(
          matchDoc => matchDoc.id === matchId
        );

        if (currentIndex === -1) {
          alert("Match not found. Please refresh the card.");
          return;
        }

        const targetIndex = currentIndex + direction;

        if (
          targetIndex < 0 ||
          targetIndex >= matches.length
        ) {
          return;
        }

        const movingMatch = matches[currentIndex];

        matches[currentIndex] = matches[targetIndex];
        matches[targetIndex] = movingMatch;

        // Save every match's new position.
        // The first match displayed gets the highest number.
        // The last match displayed becomes Match 1.
        // Batches are kept below Firestore's write limit.
        const batchSize = 400;

        for (
          let start = 0;
          start < matches.length;
          start += batchSize
        ) {
          const batch = writeBatch(db);

          const batchMatches = matches.slice(
            start,
            start + batchSize
          );

          batchMatches.forEach((matchDoc, offset) => {
            const index = start + offset;

            batch.update(
              doc(db, "events", eventId, "matches", matchDoc.id),
              {
                order: matches.length - index
              }
            );
          });

          await batch.commit();
        }

        await loadMatches(eventId);

      } catch (error) {
        console.error("Match reorder failed:", error);

        alert(
          "Unable to move match: " + error.message
        );

        await loadMatches(eventId);
      } finally {
        reorderingMatches = false;
      }
    }

    async function loadMatches(eventId) {
      const matchList = document.getElementById(
        "selected-event-matches"
      );

      matchList.textContent = "Loading matches...";

      try {
        const snapshot = await getDocs(
          collection(db, "events", eventId, "matches")
        );

        const sortedMatches = sortMatches(snapshot.docs);

        // Avoid displaying a previous event's results
        // if the user switches events while loading.
        if (selectedEventId !== eventId) return;

        matchList.textContent = "";

        if (snapshot.empty) {
          matchList.textContent = "No matches added yet.";
          return;
        }

        sortedMatches.forEach((matchDoc, index) => {
          const match = matchDoc.data();

          const card = document.createElement("article");
          card.className = "match-card";

          const position = document.createElement("div");
          position.className = "match-position";

          const orderNumber = Number(match.order);

          const validOrder =
            Number.isSafeInteger(orderNumber) &&
            orderNumber >= 1;

          if (index === 0 && sortedMatches.length > 1) {
            position.textContent = validOrder
              ? "MAIN EVENT — MATCH " + orderNumber
              : "MAIN EVENT — ORDER NOT ASSIGNED";
          } else if (
            index === sortedMatches.length - 1 &&
            sortedMatches.length > 1
          ) {
            position.textContent = validOrder
              ? "OPENER — MATCH " + orderNumber
              : "OPENER — ORDER NOT ASSIGNED";
          } else {
            position.textContent = validOrder
              ? "MATCH " + orderNumber
              : "MATCH ORDER NOT ASSIGNED";
          }

          card.appendChild(position);

          const heading = document.createElement("h4");
          heading.textContent =
            match.name || "Unnamed Match";

          card.appendChild(heading);

          const type = document.createElement("p");
          type.textContent =
            match.type || "Standard Match";

          card.appendChild(type);

          const controls = document.createElement("div");
          controls.className = "match-controls";

          // MOVE UP
          const upButton = document.createElement("button");
          upButton.className = "move-button";
          upButton.textContent = "↑ Move Up";

          upButton.disabled = index === 0;

          upButton.addEventListener("click", async () => {
            await moveMatch(eventId, matchDoc.id, -1);
          });

          controls.appendChild(upButton);

          // MOVE DOWN
          const downButton = document.createElement("button");
          downButton.className = "move-button";
          downButton.textContent = "↓ Move Down";

          downButton.disabled =
            index === sortedMatches.length - 1;

          downButton.addEventListener("click", async () => {
            await moveMatch(eventId, matchDoc.id, 1);
          });

          controls.appendChild(downButton);

          // EDIT MATCH
          const editButton = document.createElement("button");
          editButton.className = "edit-button";
          editButton.textContent = "Edit Match";

          editButton.addEventListener("click", async () => {
            const newName = prompt(
              "Edit Match Name:",
              match.name || ""
            );

            if (newName === null) return;

            const newType = prompt(
              "Edit Match Type:",
              match.type || ""
            );

            if (newType === null) return;

            const newOrder = prompt(
              "Edit Match Order (1 = Opener, highest = Main Event):",
              validOrder ? String(orderNumber) : ""
            );

            if (newOrder === null) return;

            if (!newName.trim() || !newType.trim()) {
              alert(
                "Match name and type cannot be empty."
              );
              return;
            }

            const newOrderNumber = Number(newOrder.trim());

            if (
              newOrder.trim() === "" ||
              !Number.isSafeInteger(newOrderNumber) ||
              newOrderNumber < 1
            ) {
              alert(
                "Match order must be a whole number of 1 or higher."
              );
              return;
            }

            try {
              await updateDoc(
                doc(db, "events", eventId, "matches", matchDoc.id),
                {
                  name: newName.trim(),
                  type: newType.trim(),
                  order: newOrderNumber
                }
              );

              await loadMatches(eventId);
              alert("Match updated successfully!");

            } catch (error) {
              alert(
                "Unable to update match: " + error.message
              );
            }
          });

          controls.appendChild(editButton);

          // DELETE MATCH
          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-button";
          deleteButton.textContent = "Delete Match";

          deleteButton.addEventListener("click", async () => {
            if (!confirm(
              "Are you sure you want to delete this match?"
            )) {
              return;
            }

            try {
              await deleteDoc(
                doc(db, "events", eventId, "matches", matchDoc.id)
              );

              await loadMatches(eventId);

            } catch (error) {
              alert(
                "Unable to delete match: " + error.message
              );
            }
          });

          controls.appendChild(deleteButton);

          card.appendChild(controls);
          matchList.appendChild(card);
        });

      } catch (error) {
        console.error("Match loading failed:", error);
        matchList.textContent = "Unable to load matches.";
      }
    }

    async function loadDrafts() {
      const draftList = document.getElementById(
        "draft-list"
      );

      const draftsQuery = query(
        collection(db, "events"),
        where("publicationStatus", "==", "draft")
      );

      const snapshot = await getDocs(draftsQuery);

      draftList.textContent = "";

      if (snapshot.empty) {
        draftList.textContent = "No event drafts yet.";
        return;
      }

      snapshot.forEach(eventDoc => {
        const event = eventDoc.data();
        const card = document.createElement("article");
        card.className = "event-draft";

        const heading = document.createElement("h3");

        heading.textContent =
          event.title || "Untitled Event";

        heading.style.cursor = "pointer";
        heading.style.color = "#c8a85b";

        heading.addEventListener("click", () => {
          selectedEventId = eventDoc.id;

          document.getElementById(
            "event-details"
          ).hidden = false;

          document.getElementById(
            "selected-event-title"
          ).textContent =
            event.title || "Untitled Event";

          document.getElementById(
            "selected-event-info"
          ).textContent =
            `${event.type || "Event"} | ` +
            `${event.date || "Date TBD"} | ` +
            `${event.location || "Location TBD"}`;

          loadMatches(selectedEventId);
        });

        card.appendChild(heading);
        draftList.appendChild(card);
      });
    }

    onAuthStateChanged(auth, async (user) => {
      const adminSection = document.getElementById(
        "event-admin"
      );

      const draftsSection = document.getElementById(
        "event-drafts"
      );

      adminSection.hidden = true;
      draftsSection.hidden = true;

      if (!user) return;

      try {
        const profile = await getDoc(
          doc(db, "users", user.uid)
        );

        adminSection.hidden = !(
          profile.exists() &&
          profile.data().active === true &&
          profile.data().role === "admin"
        );

        draftsSection.hidden = adminSection.hidden;

        if (!draftsSection.hidden) {
          await loadDrafts();
        }

      } catch (error) {
        console.error(
          "Admin verification failed:",
          error
        );
      }
    });

    // BOOK A MATCH
    document.getElementById(
      "add-match-btn"
    ).addEventListener("click", async () => {
      if (!selectedEventId) {
        alert("Please select an event first.");
        return;
      }

      const name = document.getElementById(
        "match-name"
      ).value.trim();

      const type = document.getElementById(
        "match-type"
      ).value.trim();

      const orderInput = document.getElementById(
        "match-order"
      ).value.trim();

      const orderNumber = Number(orderInput);

      if (!name || !type) {
        alert(
          "Please enter a match name and match type."
        );
        return;
      }

      if (
        orderInput === "" ||
        !Number.isSafeInteger(orderNumber) ||
        orderNumber < 1
      ) {
        alert(
          "Please enter a valid match order of 1 or higher."
        );
        return;
      }

      try {
        await addDoc(
          collection(
            db,
            "events",
            selectedEventId,
            "matches"
          ),
          {
            name,
            type,
            order: orderNumber,
            createdAt: new Date().toISOString()
          }
        );

        document.getElementById(
          "match-name"
        ).value = "";

        document.getElementById(
          "match-type"
        ).value = "";

        document.getElementById(
          "match-order"
        ).value = "";

        await loadMatches(selectedEventId);

        alert("Match added successfully!");

      } catch (error) {
        console.error(
          "Match booking failed:",
          error
        );

        alert(
          "Unable to add match: " + error.message
        );
      }
    });

    // CREATE EVENT
    document.getElementById(
      "create-event-btn"
    ).addEventListener("click", async () => {
      const title = document.getElementById(
        "event-title"
      ).value.trim();

      const type = document.getElementById(
        "event-type"
      ).value.trim();

      const date = document.getElementById(
        "event-date"
      ).value;

      const location = document.getElementById(
        "event-location"
      ).value.trim();

      const description = document.getElementById(
        "event-description"
      ).value.trim();

      if (!title || !type || !date) {
        alert(
          "Please enter an event name, type, and date."
        );
        return;
      }

      const user = auth.currentUser;

      if (!user) {
        alert(
          "Please sign in before creating an event."
        );
        return;
      }

      try {
        const profile = await getDoc(
          doc(db, "users", user.uid)
        );

        if (
          !profile.exists() ||
          profile.data().active !== true ||
          profile.data().role !== "admin"
        ) {
          alert(
            "Only an active admin can create events."
          );
          return;
        }

        await addDoc(collection(db, "events"), {
          title,
          type,
          date,
          location,
          description,
          authorUid: user.uid,
          publicationStatus: "draft"
        });

        alert(
          "Event draft created successfully!"
        );

        await loadDrafts();

      } catch (error) {
        console.error(
          "Event creation failed:",
          error
        );

        alert(
          "Unable to create event: " + error.message
        );
      }
    });

    loadEvents();
  </script>
</body>
</html>
